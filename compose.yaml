services:
  app:
    build: .
    ports:
      - "${PORTA:-5174}:5174"
    environment:
      COOKIE_SECRET: ${COOKIE_SECRET:?defina COOKIE_SECRET no .env}
      GRAPYDOWN_DATABASE: /dados/grapydown.sqlite
      PORTA: 5174
      NODE_ENV: production
    volumes:
      - dados:/dados

volumes:
  dados:
