nome: Processo
campos:
  # `tipo` vem primeiro de proposito: templateNo preenche enum com opcoes[0].
  - { chave: tipo, tipo: enum, opcoes: [passo, decisao, inicio, fim, ator] }
  - { chave: responsavel, tipo: texto, obrigatorio: true }
  - { chave: status, tipo: enum, opcoes: [rascunho, ativo, bloqueado, concluido] }

# Recurso e da transicao, nao do passo: prazo e "quanto custa ir de A ate B".
campos_aresta:
  - { chave: prazo, tipo: texto } # 2d, 8h
  - { chave: pessoas, tipo: texto } # 2 analistas
  - { chave: custo, tipo: texto } # R$ 1.200
  - { chave: esforco, tipo: texto } # 16h-homem
  - { chave: material, tipo: texto } # notebook, licenca

forma_por: tipo
formas:
  passo: retangulo
  decisao: losango
  inicio: estadio
  fim: estadio
  ator: ator

cor_por: status
cores:
  rascunho: "#9ca3af"
  ativo: "#2563eb"
  bloqueado: "#dc2626"
  concluido: "#16a34a"

arestas:
  padrao: { estilo: continua, ponta: cheia, cor: "#52525b" }
  excecao: { estilo: tracejada, ponta: aberta, cor: "#dc2626" }
  dado: { estilo: pontilhada, ponta: nenhuma, cor: "#2563eb" }
